AllCops:
  TargetRubyVersion: 4.0

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Like rustfmt, which leaves the crate's comments unwrapped, only code is held
# to a line length.
Layout/LineLength:
  AllowedPatterns:
    - '\A\s*#'

# Like rustfmt's use_field_init_shorthand.
Style/HashSyntax:
  EnforcedShorthandSyntax: always

# Like Clippy, whose too_many_lines lint is pedantic and off by default.
Metrics/MethodLength:
  Enabled: false
